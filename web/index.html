<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>OSRS-bossiprojekti</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c9a253'/%3E%3Cpath d='M9 22 16 8l7 14z' fill='%231b1712'/%3E%3C/svg%3E">
  <!-- Bootstrapin teema seuraa käyttöjärjestelmän tummaa/vaaleaa tilaa (Bootstrap ei tee sitä itse). -->
  <script>
    document.documentElement.dataset.bsTheme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  </script>
  <!-- Ulkoiset kirjastot: Bootstrap (ulkoasu ja komponentit) ja jQuery (DOM, tapahtumat, AJAX). -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Oma tyyli ladataan Bootstrapin jälkeen, jotta omat säännöt voittavat. -->
  <link rel="stylesheet" href="tyyli.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- app.js on moduuli: se ajetaan vasta, kun sivu on luettu, ja jQueryn $ on silloin jo käytössä. -->
  <script type="module" src="app.js"></script>
</head>
<body>
  <main id="kirjautuminen" class="kirjautuminen" hidden>
    <form id="kirjaudu" class="kortti kirjaudu">
      <h1>OSRS-bossiprojekti</h1>
      <p class="hiljainen">Viisi bossia, 3000 KC kullekin.</p>
      <input type="email" name="username" autocomplete="username" hidden>
      <!-- Bootstrapin lomakeluokat: form-label, form-control ja btn. -->
      <div>
        <label for="salasana" class="form-label">Salasana</label>
        <input id="salasana" class="form-control" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-warning">Kirjaudu</button>
      <p id="kirjautumisvirhe" class="virhe" role="alert"></p>
    </form>
  </main>

  <div id="sovellus" hidden>
    <header class="ylapalkki">
      <div class="brandi">
        <span class="merkki" aria-hidden="true"></span>
        <div>
          <h1>Bossiprojekti 3000</h1>
          <p class="hiljainen" id="tilinimi">zei_kill</p>
        </div>
      </div>
      <div class="toiminnot">
        <button id="paivita" class="btn btn-sm btn-outline-warning">Päivitä nyt</button>
        <button id="ulos" class="btn btn-sm btn-link">Kirjaudu ulos</button>
      </div>
    </header>

    <section class="luvut" id="luvut" aria-label="Yhteenveto"></section>

    <section class="kortti osat" id="osat" aria-label="Bossien osuudet"></section>

    <section class="kortti kassa" id="kassa" aria-label="Kassa"></section>

    <section>
      <h2>Bossit</h2>
      <div class="bossit" id="bossit"></div>
    </section>

    <section id="dropit-osio" hidden>
      <h2>Viimeisimmät dropit</h2>
      <ul class="dropit" id="dropit"></ul>
    </section>

    <footer class="lahteet" id="lahteet"></footer>
  </div>

  <!-- Bootstrapin modaali-ikkuna dropin kirjaukseen. app.js täyttää esineen tiedot ennen avaamista. -->
  <div class="modal fade" id="kirjaus" tabindex="-1" aria-labelledby="kirjaus-otsikko" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <form class="modal-content" id="kirjaus-lomake">
        <div class="modal-header">
          <img id="kirjaus-kuva" class="kirjaus-kuva" src="" alt="">
          <h3 class="modal-title fs-6" id="kirjaus-otsikko">Kirjaa droppi</h3>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Sulje"></button>
        </div>
        <div class="modal-body">
          <label for="kirjaus-kc" class="form-label">KC dropin kohdalla</label>
          <input id="kirjaus-kc" class="form-control" type="number" min="0" step="1" required>
          <div class="form-text" id="kirjaus-ohje"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-link" data-bs-dismiss="modal">Peru</button>
          <button type="submit" class="btn btn-warning">Tallenna</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bootstrapin toast-ilmoitus sivun alareunassa. -->
  <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3">
    <div id="ilmoitus" class="toast align-items-center" role="status" aria-live="polite" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body"></div>
        <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Sulje"></button>
      </div>
    </div>
  </div>
</body>
</html>
